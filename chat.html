<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شات العرب – مجاني</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    height:100vh;
}

/* القائمة الجانبية */
#users{
    width:260px;
    background:#020617;
    overflow-y:auto;
    border-left:1px solid #1e293b;
}

#users h2{
    text-align:center;
    padding:15px;
    margin:0;
    background:#020617;
    border-bottom:1px solid #1e293b;
}

.user{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #1e293b;
    transition:0.3s;
}

.user:hover{
    background:#1e293b;
}

.online{
    color:#22c55e;
    font-size:12px;
}

/* الشات */
#chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

#header{
    padding:15px;
    background:#020617;
    border-bottom:1px solid #1e293b;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

#messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.msg{
    max-width:70%;
    padding:10px 14px;
    margin-bottom:12px;
    border-radius:16px;
    line-height:1.6;
}

.user-msg{
    background:#2563eb;
    margin-left:auto;
    border-bottom-right-radius:4px;
}

.bot-msg{
    background:#1e293b;
    margin-right:auto;
    border-bottom-left-radius:4px;
}

/* الإدخال */
#input{
    display:flex;
    padding:10px;
    background:#020617;
    border-top:1px solid #1e293b;
}

#input input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#0f172a;
    color:#fff;
}

#input button{
    margin-right:10px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    background:#020617;
    border-top:1px solid #1e293b;
}
</style>
</head>

<body>

<!-- المستخدمون -->
<div id="users">
<h2>الدردشات النشطة</h2>
<div id="userList"></div>
</div>

<!-- الشات -->
<div id="chat">
<div id="header">شات العرب – مجاني بالكامل</div>

<div id="messages"></div>

<div id="input">
<input id="text" placeholder="اكتب رسالتك..." />
<button onclick="send()">إرسال</button>
</div>

<footer>
من نحن | سياسة الخصوصية | اتصل بنا  
<br>هذا الموقع للتجربة والترفيه فقط
</footer>
</div>

<script>
// أسماء
const names = [
"مريم","سارة","نور","لين","رنا","هدى","آية","تالا","ياسمين",
"أحمد","محمد","خالد","عمر","سامر","أنس","كريم","علاء","ياسر"
];

// ردود طبيعية
const greetings = [
"مرحبا","أهلا","أهلا وسهلا","مساء الخير","صباح الخير"
];

const questions = [
"شو عم تعمل؟","كيفك اليوم؟","شو أخبارك؟","مللان؟",
"من وين انت؟","قديش عمرك؟","شو اسمك؟"
];

const answers = [
"ولا شي","قاعد شوي","تمام الحمد لله","مبسوط",
"تعبان شوي","مشغول","فاضي هلأ"
];

const comments = [
"هههه","😊","عنجد","لطيف الحكي معك",
"مرتاح","تمام","مزبوط"
];

function rand(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

// توليد المستخدمين
const userList = document.getElementById("userList");
names.forEach(n=>{
    const d=document.createElement("div");
    d.className="user";
    d.innerHTML=`${n}<br><span class="online">● نشط الآن</span>`;
    userList.appendChild(d);
});

// الرسائل
const messages = document.getElementById("messages");

function addMsg(text,type){
    const d=document.createElement("div");
    d.className=`msg ${type}`;
    d.innerText=text;
    messages.appendChild(d);
    messages.scrollTop=messages.scrollHeight;
}

// إرسال
function send(){
    const input=document.getElementById("text");
    if(input.value==="") return;
    addMsg(input.value,"user-msg");
    input.value="";

    setTimeout(()=>{
        botReply();
    },1500 + Math.random()*2000);
}

// رد البوت
function botReply(){
    const type=Math.floor(Math.random()*4);
    let reply="";
    if(type===0) reply=rand(greetings);
    if(type===1) reply=rand(questions);
    if(type===2) reply=rand(answers);
    if(type===3) reply=rand(comments);

    addMsg(reply,"bot-msg");
}
</script>

</body>
</html>
