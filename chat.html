<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات العرب</title>
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    flex-direction:column;
    height:100vh;
}
#header{
    padding:15px;
    background:#020617;
    border-bottom:1px solid #1e293b;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}
#messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
}
.msg{
    max-width:70%;
    padding:10px 14px;
    margin-bottom:12px;
    border-radius:16px;
    line-height:1.6;
}
.user-msg{
    background:#2563eb;
    margin-left:auto;
    border-bottom-right-radius:4px;
}
.bot-msg{
    background:#1e293b;
    margin-right:auto;
    border-bottom-left-radius:4px;
}
#input{
    display:flex;
    padding:10px;
    background:#020617;
    border-top:1px solid #1e293b;
}
#input input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#0f172a;
    color:#fff;
}
#input button{
    margin-right:10px;
    padding:12px 18px;
    border:none;
    border-radius:50%;
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    background:#020617;
    border-top:1px solid #1e293b;
}
</style>
</head>
<body>

<div id="header">شات العرب</div>
<div id="messages"></div>

<div id="input">
<input id="text" placeholder="اكتب رسالتك..." />
<button onclick="send()">إرسال</button>
</div>

<footer>
من نحن | سياسة الخصوصية | اتصل بنا  
<br>هذا الموقع للتجربة والترفيه فقط
</footer>

<script>
// استلام الاسم من الرابط
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "مجهول";
document.getElementById("header").innerText = `دردشة مع ${name}`;

const messages = document.getElementById("messages");

// ردود جاهزة بلغة شارع
const replies=[
"شو عم تعمل؟","ولا شي","قاعد","عم بمشي","شو اسمك؟","اسمي مريم","كيفك؟","تمام وانت؟","مرحبا","اهلا وسهلا",
"شو أخبارك؟","تمام","وين ساكن؟","من حلب","هاي","هلا","😂","مو مشكلة","أكيد","حلو","عنجد؟"
];

function addMsg(text,type){
    const d=document.createElement("div");
    d.className="msg "+type;
    d.innerText=text;
    messages.appendChild(d);
    messages.scrollTop=messages.scrollHeight;
}

function getReply(msg){
    return replies[Math.floor(Math.random()*replies.length)];
}

function send(){
    const input=document.getElementById("text");
    if(input.value==="") return;
    addMsg(input.value,"user-msg");
    const userText=input.value;
    input.value="";
    
    setTimeout(()=>{
        addMsg(getReply(userText),"bot-msg");
    },1500 + Math.random()*1500);
}
</script>

</body>
</html>
