<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الدردشة</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: #111;
  padding: 12px;
  border-bottom: 1px solid #222;
}

.name {
  font-size: 16px;
  font-weight: bold;
}

.status {
  font-size: 12px;
  color: #3cff00;
}

.chat {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  background: #0e0e0e;
}

.msg {
  max-width: 75%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 15px;
  font-size: 14px;
}

.me {
  background: #005c4b;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.me .read {
  font-size: 11px;
  color: #4fc3f7;
  margin-top: 4px;
  text-align: right;
}

.ai {
  background: #1f1f1f;
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

.input-area {
  background: #111;
  padding: 10px;
  display: flex;
  border-top: 1px solid #222;
}

.input-area input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #1c1c1c;
  color: #fff;
}

.input-area button {
  margin-right: 10px;
  padding: 10px 16px;
  border: none;
  border-radius: 50%;
  background: #00a884;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <div class="name" id="chatName"></div>
  <div class="status">● نشط الآن</div>
</header>

<div class="chat" id="chatBox"></div>

<div class="input-area">
  <input type="text" id="messageInput" placeholder="اكتب رسالة...">
  <button onclick="sendMessage()">➤</button>
</div>

<script>
// اسم الشخص من الرابط
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "مجهول";
document.getElementById("chatName").innerText = name;

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");

// ردود طبيعية (ممكن تزيدها لاحقًا)
const replies = [
  "مرحبا 😊",
  "أهلا وسهلا",
  "كيفك؟",
  "شو عم تعمل؟",
  "ولا شي، قاعدة",
  "شو عم تعملي؟",
  "قاعد",
  "تحب نحكي شوي؟",
  "أكيد",
  "خبرني عنك",
  "شو اسمك؟",
  "اسمي مريم",
  "من وين انت؟",
  "أنا من حلب",
  "قديش عمرك؟",
  "عمري 33",
  "تحب السهر؟",
  "أحيانًا",
  "كلامك لطيف",
  "أنا مستمعة 😊",
  "لسا بدك تحكي؟",
  "أكيد",
  "الليل هدوء",
  "حاسس حالي مرتاح بالحكي معك",
  "وأنا كمان"
];

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const me = document.createElement("div");
  me.className = "msg me";
  me.innerHTML = text + '<div class="read">✔✔</div>';
  chatBox.appendChild(me);

  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;

  // رد بطيء (2–5 ثواني)
  setTimeout(() => {
    const ai = document.createElement("div");
    ai.className = "msg ai";
    ai.innerText = replies[Math.floor(Math.random() * replies.length)];
    chatBox.appendChild(ai);
    chatBox.scrollTop = chatBox.scrollHeight;
  }, Math.floor(Math.random() * 3000) + 2000);
}

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
