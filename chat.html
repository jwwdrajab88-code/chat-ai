<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شات العرب – مجاني</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* القائمة الجانبية */
#users{
    width:260px;
    background:#020617;
    overflow-y:auto;
    border-left:1px solid #1e293b;
}

#users h2{
    text-align:center;
    padding:15px;
    margin:0;
    background:#020617;
    border-bottom:1px solid #1e293b;
}

.user{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #1e293b;
    transition:0.3s;
}

.user:hover{
    background:#1e293b;
}

.online{
    color:#22c55e;
    font-size:12px;
}

/* الشات */
#chat{
    flex:1;
    display:flex;
    flex-direction:column;
    transition: all 0.3s;
}

#header{
    padding:15px;
    background:#020617;
    border-bottom:1px solid #1e293b;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

#messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.msg{
    max-width:70%;
    padding:10px 14px;
    margin-bottom:12px;
    border-radius:16px;
    line-height:1.6;
}

.user-msg{
    background:#2563eb;
    margin-left:auto;
    border-bottom-right-radius:4px;
}

.bot-msg{
    background:#1e293b;
    margin-right:auto;
    border-bottom-left-radius:4px;
}

/* الإدخال */
#input{
    display:flex;
    padding:10px;
    background:#020617;
    border-top:1px solid #1e293b;
}

#input input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#0f172a;
    color:#fff;
}

#input button{
    margin-right:10px;
    padding:12px 18px;
    border:none;
    border-radius:50%;
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    background:#020617;
    border-top:1px solid #1e293b;
}
</style>
</head>

<body>

<!-- المستخدمون -->
<div id="users">
<h2>الدردشات النشطة</h2>
<div id="userList"></div>
</div>

<!-- الشات -->
<div id="chat">
<div id="header">شات العرب – مجاني بالكامل</div>

<div id="messages"></div>

<div id="input">
<input id="text" placeholder="اكتب رسالتك..." />
<button onclick="send()">إرسال</button>
</div>

<footer>
من نحن | سياسة الخصوصية | اتصل بنا  
<br>هذا الموقع للتجربة والترفيه فقط
</footer>
</div>

<script>
// أسماء وهمية
const names = [
"مريم","سارة","نور","لين","رنا","هدى","آية","تالا","ياسمين",
"أحمد","محمد","خالد","عمر","سامر","أنس","كريم","علاء","ياسر"
];

// المستخدمين
const userList = document.getElementById("userList");
names.forEach(n=>{
    const d=document.createElement("div");
    d.className="user";
    d.innerHTML=`${n}<br><span class="online">● نشط الآن</span>`;
    d.onclick = ()=>{
        startChat(n);
    };
    userList.appendChild(d);
});

// الرسائل
const messages = document.getElementById("messages");
const chatDiv = document.getElementById("chat");
const inputDiv = document.getElementById("input");

// آلاف الردود جاهزة (مزيج لغة شارع + منطقية)
const questionsReplies = [
    ["شو عم تعمل؟", "ولا شي، قاعدة شوي", "قاعد شوي وشايفك", "قاعد على الموبايل"],
    ["كيفك اليوم؟", "تمام الحمد لله", "بخير وانت؟", "مش بطال اليوم"],
    ["شو أخبارك؟", "والله عادي", "تمام ونت؟", "كل شي تمام"],
    ["قديش عمرك؟", "33 سنة", "27 سنة", "مو مهم 😄"],
    ["شو اسمك؟", "اسمي مريم", "أنا أحمد", "أحمد", "محمد"],
    ["من وين انت؟", "من حلب", "من دمشق", "من الأردن", "من لبنان"],
    ["تحب القهوة ولا الشاي؟", "قهوة أكتر", "الشاي أحيانًا", "يعني كلاهما 😅"],
    ["شو بتشتغل؟", "طالبة جامعة", "موظف", "بدون شغل هلأ"],
    ["تحب المزح؟", "أكيد", "بس شوي 😅", "بحب المزح أحيانًا"],
    ["تحب السهر؟", "أحيانًا", "أيوه كتير", "مو كل يوم"]
];

// وظيفة اختيار الرد
function getReply(msg){
    msg = msg.toLowerCase();
    for(const q of questionsReplies){
        if(q.some(s=>msg.includes(s[0].toLowerCase()))){
            return q[1 + Math.floor(Math.random()*(q.length-1))];
        }
    }
    // رد عام
    const general = ["😂 صح صح","عنجد؟","حلو","تمام","😊","هههه","أكيد","مو مشكلة"];
    return general[Math.floor(Math.random()*general.length)];
}

function addMsg(text,type){
    const d=document.createElement("div");
    d.className=`msg ${type}`;
    d.innerText=text;
    messages.appendChild(d);
    messages.scrollTop=messages.scrollHeight;
}

function send(){
    const input=document.getElementById("text");
    if(input.value==="") return;
    addMsg(input.value,"user-msg");
    const userText=input.value;
    input.value="";
    
    // تأخير طبيعي
    setTimeout(()=>{
        addMsg(getReply(userText),"bot-msg");
    },1500 + Math.random()*2500);
}

// تصغير الشات عند فتح اسم
function startChat(name){
    chatDiv.style.flex="1";
    chatDiv.scrollTop=chatDiv.scrollHeight;
    addMsg(`أنت دخلت دردشة ${name}`,"bot-msg");
}
</script>

</body>
</html>
