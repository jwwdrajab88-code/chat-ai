<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات العرب – دردشة</title>
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    flex-direction:column;
    height:100vh;
}
#header{
    padding:15px;
    background:#020617;
    border-bottom:1px solid #1e293b;
    font-size:20px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
#header span.status{
    color:#22c55e;
    font-size:12px;
}
#messages{
    flex:1;
    padding:10px;
    overflow-y:auto;
}
.msg{
    max-width:70%;
    padding:10px 14px;
    margin-bottom:12px;
    border-radius:16px;
    line-height:1.6;
    position:relative;
    word-wrap:break-word;
}
.user-msg{
    background:#2563eb;
    margin-left:auto;
    border-bottom-right-radius:4px;
}
.bot-msg{
    background:#1e293b;
    margin-right:auto;
    border-bottom-left-radius:4px;
}
.msg .tick{
    font-size:12px;
    color:#22c55e;
    position:absolute;
    bottom:2px;
    right:6px;
}
#input{
    display:flex;
    padding:10px;
    background:#020617;
    border-top:1px solid #1e293b;
}
#input input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:50px;
    outline:none;
    background:#0f172a;
    color:#fff;
}
#input button{
    margin-right:10px;
    padding:12px 18px;
    border:none;
    border-radius:50%;
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    background:#020617;
    border-top:1px solid #1e293b;
}
</style>
</head>
<body>

<div id="header">
    <span id="chatName">دردشة</span>
    <span class="status">● نشط الآن</span>
</div>

<div id="messages"></div>

<div id="input">
<input id="text" placeholder="اكتب رسالتك..." />
<button onclick="send()">إرسال</button>
</div>

<footer>
من نحن | سياسة الخصوصية | اتصل بنا  
<br>هذا الموقع للتجربة والترفيه فقط
</footer>

<script>
// استقبال الاسم من الرابط
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "مجهول";
document.getElementById("chatName").innerText = name;

// الرسائل
const messages = document.getElementById("messages");

// ردود جاهزة بلغة شارع
const replies = [
"شو عم تعمل؟","ولا شي","قاعد","عم بمشي","شو اسمك؟","اسمي مريم","كيفك؟","تمام وانت؟",
"مرحبا","اهلا وسهلا","شو أخبارك؟","تمام","وين ساكن؟","من حلب","هاي","هلا",
"😂","مو مشكلة","أكيد","حلو","عنجد؟","تمام","مش بطال اليوم"
];

function addMsg(text,type){
    const d=document.createElement("div");
    d.className=`msg ${type}`;
    d.innerText=text;

    // صحين القراءة فقط لرسائل المستخدم
    if(type==="user-msg"){
        const tick = document.createElement("span");
        tick.className="tick";
        tick.innerText="✔✔";
        d.appendChild(tick);
    }

    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
}

function getReply(msg){
    return replies[Math.floor(Math.random()*replies.length)];
}

function send(){
    const input = document.getElementById("text");
    if(input.value==="") return;
    addMsg(input.value,"user-msg");
    const userText = input.value;
    input.value="";

    // رد بطيء عشوائي
    setTimeout(()=>{
        addMsg(getReply(userText),"bot-msg");
    },1500 + Math.random()*1500);
}
</script>

</body>
</html>
