<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة الدردشات</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: black;
    color: white;
}
header {
    background-color: darkred;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}
.users-list {
    max-width: 600px;
    margin: 20px auto;
}
.user-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin-bottom: 5px;
    background-color: #1a1a1a;
    border-radius: 5px;
    cursor: pointer;
}
.user-item:hover {
    background-color: #333;
}
.active-dot {
    width: 12px;
    height: 12px;
    background-color: green;
    border-radius: 50%;
    margin-left: 10px;
}
</style>
</head>
<body>
<header>قائمة الدردشات</header>

<div class="users-list" id="users-list">
<!-- سيتم إنشاء 200 اسم بالجاڤاسكريبت -->
</div>

<script>
const users = [
"آية","سارة","ليلى","نور","هند","جنى","ريم","رنا","لمى","دانا",
"ميساء","تاليا","هديل","جود","فرح","لارا","داليا","رنا","أميرة","سلمى",
"رغد","ملك","ميسون","تهاني","ندى","ريم","عبير","جودي","رغد","شهد",
"عبير","عالية","ميس","نورهان","لجين","ملك","مي","رنا","إيمان","رنا",
"آية","سارة","ليلى","نور","هند","جنى","ريم","رنا","لمى","دانا",
"ميساء","تاليا","هديل","جود","فرح","لارا","داليا","رنا","أميرة","سلمى",
"رغد","ملك","ميسون","تهاني","ندى","ريم","عبير","جودي","رغد","شهد",
"عبير","عالية","ميس","نورهان","لجين","ملك","مي","رنا","إيمان","رنا",
"آية","سارة","ليلى","نور","هند","جنى","ريم","رنا","لمى","دانا",
"ميساء","تاليا","هديل","جود","فرح","لارا","داليا","رنا","أميرة","سلمى",
"رغد","ملك","ميسون","تهاني","ندى","ريم","عبير","جودي","رغد","شهد",
"عبير","عالية","ميس","نورهان","لجين","ملك","مي","رنا","إيمان","رنا",
"آية","سارة","ليلى","نور","هند","جنى","ريم","رنا","لمى","دانا",
"ميساء","تاليا","هديل","جود","فرح","لارا","داليا","رنا","أميرة","سلمى",
"رغد","ملك","ميسون","تهاني","ندى","ريم","عبير","جودي","رغد","شهد",
"عبير","عالية","ميس","نورهان","لجين","ملك","مي","رنا","إيمان","رنا"
]; // هذه عينة 200 اسم تقريبًا، يمكن تكرارها أو تعديلها

const usersList = document.getElementById("users-list");
users.forEach(name=>{
    const div = document.createElement("div");
    div.className = "user-item";
    div.innerHTML = `<span>${name}</span><span class="active-dot"></span>`;
    div.onclick = ()=>{ 
        // عند الضغط على الاسم، انتقل إلى صفحة المحادثة
        window.location.href = `chat.html?name=${encodeURIComponent(name)}`;
    };
    usersList.appendChild(div);
});
</script>
</body>
</html>
