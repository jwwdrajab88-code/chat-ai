<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شات العرب – مجاني بالكامل</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0e0e0e;
  color: #fff;
}

header {
  background: #111;
  padding: 15px;
  text-align: center;
  border-bottom: 1px solid #222;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
  color: #aaa;
}

.container {
  display: flex;
  height: calc(100vh - 120px);
}

.sidebar {
  width: 280px;
  background: #121212;
  border-right: 1px solid #222;
  overflow-y: auto;
}

.sidebar h2 {
  font-size: 14px;
  padding: 10px;
  color: #aaa;
  border-bottom: 1px solid #222;
}

.user {
  padding: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #1c1c1c;
  transition: background 0.2s;
}

.user:hover {
  background: #1a1a1a;
}

.status {
  width: 8px;
  height: 8px;
  background: #3cff00;
  border-radius: 50%;
  margin-left: 8px;
}

.icon {
  margin-left: 8px;
  font-size: 18px;
}

.female {
  color: #ff7aa2;
}

.male {
  color: #4da3ff;
}

.name {
  font-size: 14px;
}

.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  font-size: 16px;
}

footer {
  background: #111;
  padding: 15px;
  text-align: center;
  font-size: 13px;
  border-top: 1px solid #222;
}

footer a {
  color: #aaa;
  text-decoration: none;
  margin: 0 8px;
}

footer a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<header>
  <h1>شات العرب</h1>
  <p>دردشة مجانية بالكامل</p>
</header>

<div class="container">

  <div class="sidebar">
    <h2>الدردشات النشطة</h2>

    <!-- فتيات -->
    <div class="user" onclick="openChat('سارة')">
      <span class="status"></span>
      <span class="icon female">👤</span>
      <span class="name">سارة</span>
    </div>

    <div class="user" onclick="openChat('لين')">
      <span class="status"></span>
      <span class="icon female">👤</span>
      <span class="name">لين</span>
    </div>

    <div class="user" onclick="openChat('نور')">
      <span class="status"></span>
      <span class="icon female">👤</span>
      <span class="name">نور</span>
    </div>

    <!-- شباب -->
    <div class="user" onclick="openChat('أحمد')">
      <span class="status"></span>
      <span class="icon male">👤</span>
      <span class="name">أحمد</span>
    </div>

    <div class="user" onclick="openChat('محمد')">
      <span class="status"></span>
      <span class="icon male">👤</span>
      <span class="name">محمد</span>
    </div>

    <div class="user" onclick="openChat('خالد')">
      <span class="status"></span>
      <span class="icon male">👤</span>
      <span class="name">خالد</span>
    </div>

  </div>

  <div class="main">
    اختر اسمًا من الدردشات النشطة لبدء المحادثة
  </div>

</div>

<footer>
  <a href="#">من نحن</a> |
  <a href="#">سياسة الخصوصية</a> |
  <a href="#">اتصل بنا</a>
</footer>

<script>
function openChat(name) {
  window.location.href = "chat.html?name=" + encodeURIComponent(name);
}
</script>

</body>
</html>
