<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شات العرب – مجاني</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
}
h1{
    text-align:center;
    padding:15px;
    background:#020617;
    margin:0;
    font-size:22px;
}
#users{
    max-width:400px;
    margin:10px auto;
    background:#020617;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #1e293b;
}
.user{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #1e293b;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.3s;
}
.user:hover{
    background:#1e293b;
}
.user span.icon{
    font-size:18px;
}
.online{
    color:#22c55e;
    font-size:12px;
}
footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    margin-top:20px;
    color:#aaa;
}
</style>
</head>
<body>

<h1>شات العرب – مجاني بالكامل</h1>

<div id="users"></div>

<footer>
من نحن | سياسة الخصوصية | اتصل بنا  
<br>هذا الموقع للتجربة والترفيه فقط
</footer>

<script>
// أسماء عربية مختلطة 200 اسم
const names = [
"مريم","سارة","نور","لين","رنا","هدى","آية","تالا","ياسمين","فرح","ليلى","هند","جنى","سلمى","ندى","رهف",
"أحمد","محمد","خالد","عمر","سامر","أنس","كريم","علاء","ياسر","علي","آدم","زياد","رامي","مالك","حاتم","سفيان",
"جميلة","هالة","سحر","رانية","ليان","مي","جودي","داليا","لمياء","سوسن","غادة","سهى","رولا","دينا","سعاد",
"آية","شهد","لمى","نورا","إيمان","هديل","صفاء","نورهان","جود","بسملة","ريما","رانيا","لانا","ياسمين","تالا",
"مالك","رائد","ريان","حاتم","زياد","بدر","سليم","أوس","تيم","حسن","إياد","فادي","وليد","جواد","وسيم","نبيل",
"رنا","ميلا","جنى","تاليا","يارا","جوري","لارا","ميساء","نور","آية","رهف","عالية","ليان","حلا","سما","دانا",
"كريم","سامي","رامي","أحمد","يوسف","عمر","سعيد","خالد","زياد","مهند","أيمن","طارق","هاني","أنس","مالك","رائد",
"هدى","سلمى","ليلى","جميلة","غادة","صفاء","دينا","ملاك","لينا","روان","نورهان","رانيا","تالا","هالة","بسمة",
"محمد","خالد","عمر","سامي","أنس","يوسف","رامي","سليم","مالك","رائد","زياد","طارق","وسيم","نبيل","حاتم",
"نور","ليان","رنا","جود","آية","شهد","جوري","ميلا","رهف","لارا","جنى","تاليا","ياسمين","تالا","فرح",
"عمر","سامي","زيد","أحمد","كريم","هشام","معتز","سيف","مالك","رامي","بدر","حاتم","محمد","خالد","يوسف","أنس",
"ليلى","مريم","نور","سارة","رنا","هدى","جنى","آية","ياسمين","فرح","مي","رولا","ليان","لارا","تالا","بسمة",
"سلمى","نورهان","جود","رهف","هالة","ميلا","دينا","سما","تاليا","جوري","روان","رنا","هديل","ملاك","بسملة",
"يوسف","عمر","خالد","زياد","رامي","مالك","أنس","سامي","سليم","جواد","وسيم","نبيل","طارق","هاني","أحمد"
];

const usersDiv = document.getElementById("users");
names.forEach(name=>{
    const d=document.createElement("div");
    d.className="user";
    d.innerHTML=`<span>${name}</span><span><span class="online">● نشط الآن</span> <span class="icon">${name.length%2===0?"👤":"👤"}</span></span>`;
    d.onclick = ()=>{
        // فتح صفحة chat.html باسم المستخدم
        window.location.href = `chat.html?name=${encodeURIComponent(name)}`;
    };
    usersDiv.appendChild(d);
});
</script>

</body>
</html>
