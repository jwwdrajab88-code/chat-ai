<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة بالذكاء الاصطناعي</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: black;
    color: white;
}
header {
    background-color: darkred;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}
.language-selector {
    position: absolute;
    top: 15px;
    right: 20px;
}
.chat-container {
    max-width: 600px;
    margin: 50px auto;
    background-color: #1a1a1a;
    padding: 20px;
    border-radius: 10px;
}
.chat-box {
    width: 100%;
    height: 300px;
    background-color: black;
    color: white;
    padding: 10px;
    overflow-y: scroll;
    border: 1px solid #444;
}
input[type="text"] {
    width: 80%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #444;
    background-color: #111;
    color: white;
}
button {
    padding: 10px 15px;
    margin-top: 10px;
    border: none;
    border-radius: 5px;
    background-color: darkred;
    color: white;
    cursor: pointer;
}
.users-list {
    margin-top: 20px;
    max-height: 200px;
    overflow-y: scroll;
}
.user-item {
    display: flex;
    align-items: center;
    margin-bottom: 5px;
}
.user-item img.flag {
    width: 20px;
    height: 15px;
    margin-right: 10px;
}
footer {
    margin-top: 30px;
    font-size: 12px;
    text-align: center;
    color: #aaa;
}
</style>
</head>
<body>

<header>
دردشة بالذكاء الاصطناعي
<div class="language-selector">
<select id="language">
<option value="ar">العربية</option>
<option value="en">English</option>
<option value="tr">Türkçe</option>
</select>
</div>
</header>

<div class="chat-container">
<div class="chat-box" id="chat-response"></div>
<input type="text" id="user-input" placeholder="اكتب هنا...">
<button onclick="sendMessage()">إرسال</button>

<div class="users-list" id="users-list">
<!-- أمثلة أسماء فتيات مع أعلام -->
<div class="user-item"><img class="flag" src="https://flagcdn.com/sa.svg">سارة (السعودية)</div>
<div class="user-item"><img class="flag" src="https://flagcdn.com/tr.svg">إيلا (تركيا)</div>
<div class="user-item"><img class="flag" src="https://flagcdn.com/us.svg">ليلى (الولايات المتحدة)</div>
<!-- أضف المزيد حسب الحاجة -->
</div>
</div>

<footer>
من نحن | سياسة الخصوصية | جميع الحقوق محفوظة &copy; 2026
</footer>

<script>
// رابط Worker الخاص بك
const WORKER_URL = "PUT_WORKER_URL_HERE"; // ضع هنا رابط Worker

async function sendMessage() {
    const input = document.getElementById("user-input");
    const message = input.value.trim();
    if (!message) return;

    const chatBox = document.getElementById("chat-response");
    chatBox.innerHTML += `<div>أنت: ${message}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    input.value = "";
    chatBox.innerHTML += `<div>… يكتب</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });
        const data = await res.json();
        chatBox.innerHTML += `<div>AI: ${data.reply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (e) {
        chatBox.innerHTML += `<div>AI: حدث خطأ في الاتصال</div>`;
    }
}
</script>
https://odd-bird-ed19.jwwdrajab88.workers.dev
</body>
</html>
